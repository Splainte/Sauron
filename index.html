<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Sauron</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header>
    <h1>👁 Sauron</h1>
    <div id="status" class="status paused">Démarrage…</div>
  </header>

  <div class="target-row">
    <span class="label">Projet :</span>
    <span id="target">—</span>
  </div>

  <div class="controls">
    <button id="check">Check</button>
    <button id="sync" disabled>Synchroniser</button>
  </div>

  <div class="folders-section">
    <div class="label">Dossiers détectés :</div>
    <div id="folders"><span class="muted">—</span></div>
  </div>

  <div id="log"></div>

  <div class="footer-row">
    <span class="muted" id="version">v?</span>
    <button id="update" class="small">Vérifier les mises à jour</button>
  </div>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
